services:
  api:
    build:
      context: ../app
      dockerfile: ../q1/Dockerfile.multistage
    image: spam-api:multi-redis
    container_name: spam-api-redis
    ports:
      - "8080:8080"
    environment:
      REDIS_HOST: cache
    depends_on:
      - cache

  cache:
    image: "redis:7-alpine"
    container_name: spam-cache-container
